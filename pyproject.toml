[project]
name = "ryoshoku-ocr"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["pdfplumber==0.11.10", "rapidocr==3.10.0", "onnxruntime==1.23.2", "opencv-python-headless==5.0.0.93"]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["python/tests"]
